• Licitud y lealtad: tratar datos de forma lícita y leal.
• Finalidad: fines específicos, explícitos y lícitos.
• Proporcionalidad: solo datos necesarios para la finalidad.
• Calidad: datos exactos, completos, actuales y pertinentes.
• Responsabilidad: el responsable responde por el cumplimiento.
• Seguridad: medidas adecuadas contra acceso o pérdida no autorizados.
• Transparencia: información clara y permanente para el titular.
• Confidencialidad: secreto sobre los datos, incluso después de la relación.`},{patterns:[/consentimiento|autoriz|acepto|permiso|otorga.*consentimiento/i],answer:"El consentimiento debe ser libre, informado, específico, previo e inequívoco (Art. 12). Puede otorgarse por escrito, verbal o electrónico, mediante declaración o acto afirmativo. El titular puede revocarlo en cualquier momento sin efectos retroactivos. Si se toma en un contrato donde no es necesario, se presume que no fue libre. Para datos sensibles se requiere consentimiento expreso por escrito o medio equivalente."},{patterns:[/sin consentimiento|sin autoriz|cuándo no.*consentimiento|cuándo se puede tratar sin/i],answer:`Es lícito tratar sin consentimiento en estos casos (Art. 13):

• Obligaciones económicas/financieras/bancarias.
• Cumplimiento de obligación legal.
• Ejecución de contrato con el titular.
• Interés legítimo del responsable (si no se afectan derechos del titular).
• Ejercicio o defensa de derechos ante tribunales.`},{patterns:[/derecho|derechos|derechos.*titular|qué derecho/i],answer:`Los titulares tienen 6 derechos (Art. 4), intransferibles e irrenunciables:

• Acceso (Art. 5): confirmar si se tratan datos y acceder a la información completa.
• Rectificación (Art. 6): corregir datos inexactos, incompletos o desactualizados.
• Supresión (Art. 7): solicitar eliminación cuando ya no sean necesarios.
• Oposición (Art. 8): oponerse a un tratamiento determinado.
• Portabilidad (Art. 9): obtener copia en formato estructurado para otro responsable.
• Bloqueo (Art. 8 ter): suspender temporalmente el tratamiento.`},{patterns:[/plazo.*respuesta|cuánto.*responder|tiempo.*responder|plazo.*responsable/i],answer:"El responsable debe acusar recibo y responder dentro de 30 días corridos desde la recepción de la solicitud (Art. 11). Este plazo puede prorrogarse una sola vez por 30 días más. Si no responde, el titular puede reclamar directamente ante la APDP. Para bloqueo temporal, el plazo es de 2 días hábiles."},{patterns:[/acceso|derecho.*acceso|qué datos.*tienes.*mí/i],answer:"Derecho de acceso (Art. 5): el titular puede solicitar y obtener confirmación de si sus datos están siendo tratados, y en caso afirmativo: los datos tratados, su origen, finalidad, destinatarios, período de conservación e información sobre decisiones automatizadas. El responsable siempre debe dar acceso, salvo excepción legal expresa."},{patterns:[/rectific|corregir|modificar.*datos|actualizar.*datos|datos.*incorrectos/i],answer:"Derecho de rectificación (Art. 6): cuando los datos sean inexactos, incompletos o desactualizados, el titular puede solicitar corrección. El responsable debe comunicar los cambios a todas las personas a quienes haya cedido los datos."},{patterns:[/supresi|elimin|borrar.*datos|derecho.*olvido|derecho.*supresi/i],answer:"Derecho de supresión (Art. 7): el titular puede solicitar eliminación cuando los datos ya no sean necesarios, el consentimiento fue revocado o el tratamiento es ilícito. No procede cuando haya obligación legal de conservarlos o se necesiten para la defensa de derechos ante tribunales."},{patterns:[/oposici|oponerse|no quiero.*traten|detener.*tratamiento/i],answer:"Derecho de oposición (Art. 8): el titular puede oponerse cuando el tratamiento se base en interés legítimo o sea para fines de mercadeo directo. El responsable debe cesar el tratamiento si no demuestra motivos legítimos imperiosos."},{patterns:[/portab|copi.*datos|mover.*datos|transferir.*datos a otro/i],answer:"Derecho a la portabilidad (Art. 9): el titular puede recibir sus datos en formato electrónico estructurado y de uso común, o solicitar transferencia directa a otro responsable cuando sea técnicamente posible. No incluye datos anonimizados ni tratados con base legal distinta al consentimiento."},{patterns:[/bloqueo|bloquear.*datos|suspender.*tratamiento/i],answer:"Derecho de bloqueo temporal (Art. 8 ter): puede solicitarse junto con rectificación, supresión u oposición. El responsable debe responder en 2 días hábiles y mientras tanto no puede tratar esos datos. Si rechaza, debe comunicarlo a la APDP."},{patterns:[/obligaciones|deberes|responsable.*debe|obligaciones.*responsable/i],answer:`Principales obligaciones del responsable (Art. 14):

• Informar y acreditar la licitud del tratamiento.
• Recolectar de fuentes lícitas con fines específicos.
• Comunicar información exacta, completa y actual.
• Suprimir datos de precontratos cuando no se concrete.
• Cumplir todos los principios de la ley.

Además: deber de secreto (Art. 14 bis), información permanente al público (Art. 14 ter), protección desde el diseño (Art. 14 quater), medidas de seguridad (Art. 14 quinquies) y reporte de brechas (Art. 14 sexies).`},{patterns:[/deber.*información|transparencia|información.*pública|política.*datos/i],answer:`Artículo 14 ter: el responsable debe mantener permanentemente en su web o medio equivalente:

• Política de tratamiento de datos y versión vigente.
• Identificación del responsable y representante legal.
• Medio de contacto (correo, formulario, etc.).
• Categorías de datos tratados, destinatarios, finalidades y base legal.
• Política de seguridad.
• Derechos del titular y cómo ejercerlos.
• Derecho de reclamación ante la APDP.
• Transferencias internacionales, si existen.
• Plazos de conservación y fuente de los datos.`},{patterns:[/deber.*seguridad|medidas.*seguridad|protección.*datos|cifrado|seudonimi/i],answer:"Artículo 14 quinquies: el responsable debe aplicar medidas técnicas y organizativas apropiadas al riesgo: seudonimización y cifrado de datos, confidencialidad, integridad, disponibilidad, resiliencia, restauración rápida ante incidentes y verificación periódica de eficacia. Se aplica el enfoque basado en riesgo, considerando el estado de la técnica y los costos."},{patterns:[/brecha|vulneración|filtración|incidente.*seguridad|hack|robo.*datos/i],answer:"Artículo 14 sexies: ante una vulneración de seguridad que genere riesgo para los titulares, el responsable debe reportar a la APDP 'sin dilaciones indebidas'. Si involucra datos sensibles, NNA o financieros, también debe comunicar a cada titular afectado en lenguaje claro, informando datos afectados, consecuencias y medidas adoptadas."},{patterns:[/delegado|encargado.*prevención|delegado.*protección|dpo/i],answer:"Artículo 50: el delegado de protección de datos es una persona con autonomía que asesora, supervisa y formación al equipo. Puede asumir otras funciones siempre que no haya conflicto. En micro, pequeñas y medianas empresas, el dueño puede asumir personalmente este rol. Su función: asesorar, supervisar, formar, planificar, atender consultas de titulares y ser punto de contacto con la APDP."},{patterns:[/evaluación.*impacto|evaluación.*impacto.*protección|alta.*riesgo|riesgo.*alto/i],answer:`Artículo 15 ter: se requiere evaluación de impacto cuando el tratamiento pueda generar alto riesgo para derechos. Es obligatoria en 4 casos:

• Perfilamiento automatizado con efectos jurídicos significativos.
• Tratamiento masivo o a gran escala.
• Monitoreo sistemático de zonas de acceso público.
• Tratamiento de datos sensibles en excepciones del consentimiento.

La APDP publicará una lista orientativa de tratamientos que la requieren.`},{patterns:[/datos sensibles|sensibles.*definition|qué son.*sensibles|categoría.*especial/i],answer:`Artículo 2: son datos personales sensibles aquellos que revelen:

• Origen étnico o racial.
• Afiliación política, sindical o gremial.
• Situación socioeconómica.
• Convicciones ideológicas o filosóficas.
• Creencias religiosas.
• Datos relativos a la salud.
• Perfil biológico humano.
• Datos biométricos.
• Información relativa a la vida sexual, orientación sexual e identidad de género.

Requieren consentimiento expresa por escrito para su tratamiento, salvo excepciones legales.`},{patterns:[/salud.*datos|datos.*salud|perfil.*biológico|genético|proteómico/i],answer:"Artículo 16 bis: los datos de salud y perfil biológico humano (genéticos, proteómicos, metabólicos) solo pueden tratarse para fines previstos en leyes especiales sanitarias. Sin consentimiento solo en: salvaguardar vida/integridad, alerta sanitaria decretada, fines históricos/estadísticos/científicos anonimizados, o defensa de derechos ante tribunales."},{patterns:[/biométrico|biometría|huella|facial|iris|reconocimiento.*facial/i],answer:"Artículo 16 ter: datos biométricos son aquellos obtenidos a partir de una técnica o tecnología aplicada a una parte del cuerpo o sobre otra característica fisiológica o de comportamiento, que permita confirmar su identificación única. Su tratamiento requiere: identificar el sistema biométrico usado, explicar cómo serán utilizados, informar el período de conservación y forma de destrucción. El titular puede solicitar destrucción cuando no se necesiten."},{patterns:[/niños|niñas|adolescentes|menores|menor.*edad|hijos/i],answer:"Artículo 16 quinquies: los datos de niños, niñas y adolescentes solo pueden tratarse con consentimiento del titular o representante legal, con fines específicos e información clara. Se aplican principios de necesidad y proporcionalidad reforzados. La evaluación de impacto es requerida siempre para estos tratamientos. Los datos biométricos de NNA menores de 14 años requieren consentimiento expresa y documentada."},{patterns:[/multa|sanción|sanciones|penalidad|castig|cuánto.*pago|cuánto.*paga/i],answer:`Artículo 35 de la Ley 21.719:

• Infracciones leves: amonestación escrita o multa de hasta 5.000 UTM.
• Infracciones graves: multa de hasta 10.000 UTM.
• Infracciones gravísimas: multa de hasta 20.000 UTM.

Si no se subsana en 60 días: recargo de 50%. Reincidencia: hasta 3× el monto. Para empresas que no sean de menor tamaño, multa adicional hasta 2% o 4% de ingresos anuales por ventas. La APDP puede suspender operaciones hasta 30 días por infracciones gravísimas reiteradas en 24 meses.`},{patterns:[/infracción.*leve|leve.*infracción|qué es.*infracción.*leve/i],answer:`Infracciones leves (Art. 34 bis):
• Incumplir el deber de información y transparencia (Art. 14 ter).
• No tener medio de contacto operativo para titulares.
• No responder solicitudes de titulares (o responder incompleta o tarde).
• Omitir comunicaciones obligatorias a la APDP.
• Incumplir instrucciones generales de la APDP.`},{patterns:[/infracción.*grave|grave.*infracción|qué es.*infracción.*grave/i],answer:`Infracciones graves (Art. 34 ter):
• Tratar datos sin consentimiento o sin base legal.
• Comunicar datos sin consentimiento o para fin distinto.
• Tratar datos innecesarios o inexactos.
• Impedir derechos de acceso, rectificación, supresión u oposición.
• Tratar datos de NNA sin cumplir requisitos.
• Vulnerar secreto/confidencialidad.
• Incumplir medidas de seguridad.
• Transferencias internacionales ilegales.
• No cumplir resoluciones de la APDP.`},{patterns:[/infracción.*gravísima|gravísima.*infracción|qué es.*gravísima/i],answer:`Infracciones gravísimas (Art. 34 quáter):
• Tratar datos en forma fraudulenta.
• Destinar maliciosamente datos a finalidad distinta.
• Comunicar información falsa o inexacta a sabiendas.
• Vulnerar secreto sobre datos sensibles.
• Tratar datos sensibles o de NNA a sabiendas en contravención.
• Omitir deliberadamente reporte de brechas.
• Tratamiento masivo ilegal de registros de infracciones.
• Transferencias internacionales sabiendo que no son lícitas.
• Incumplir resoluciones de la APDP.
• Falsificar información en el modelo de prevención.`},{patterns:[/atenuante|atenuantes|circunstancia.*atenuante/i],answer:"Circunstancias atenuantes (Art. 36): 1) Acciones unilaterales de reparación. 2) Colaboración con la investigación. 3) Ausencia de sanciones previas. 4) Autodenuncia ante la APDP con medidas de cese/mitigación. 5) Haber cumplido diligentemente sus deberes de supervisión (certificado de modelo de prevención vigente)."},{patterns:[/agravante|agravantes|circunstancia.*agravante/i],answer:"Circunstancias agravantes (Art. 36): a) Reincidencia (sancionado 2+ veces en 30 meses). b) Carácter continuado de la infracción. c) Haber puesto en riesgo derechos y libertades de los titulares respecto a sus datos."},{patterns:[/modelo.*prevención|prevención.*infracciones|programa.*cumplimiento|certificac/i],answer:`Artículo 49: los responsables podrán voluntariamente adoptar un Modelo de Prevención de Infracciones (programa de cumplimiento) que incluya:

• Designación de delegado de protección.
• Identificación del tipo de información y datos tratados.
• Identificación de procesos de alto riesgo.
• Protocolos y procedimientos específicos.
• Mecanismos de reporte interno y a la APDP.
• Sanciones administrativas internas.

El certificado tiene vigencia de 3 años. Su existencia es circunstancia atenuante ante la APDP.`},{patterns:[/apdp|agencia.*protección|agencia.*datos|fiscaliz|reclamo.*agencia/i],answer:"La Agencia de Protección de Datos Personales (APDP) es el organismo fiscalizador creado por la Ley 21.719. Puede fiscalizar de oficio o por denuncia, sin aviso previo. Administra el Registro Nacional de Sanciones y Cumplimiento. Emite instrucciones, orientaciones y listas orientativas. Las resoluciones de la APDP son apelables ante la Corte de Apelaciones correspondiente."},{patterns:[/reclam|reclamo|queja.*agencia|denuncia.*agencia/i],answer:"Si el responsable rechaza o no responde oportunamente una solicitud de derechos (30+30 días), el titular puede reclamar ante la APDP. El plazo para reclamar es de 30 días hábiles. La APDP notificará al responsable y resolverá según el procedimiento establecido en la ley."},{patterns:[/transferencia.*internacional|datos.*extranjero|fuera.*chile|internacional.*datos/i],answer:"La ley regula las transferencias internacionales de datos: solo son lícitas si el país receptor ofrece nivel adecuado de protección, o si existen garantías adecuadas (cláusulas contractuales, normas corporativas vinculantes, etc.). Si no hay nivel adecuado, se debe informar al titular. Las transferencias en contravención son infracciones graves (Art. 34 ter, literal m)."},{patterns:[/qué hacen|servicios|servicio|qué ofrecen|paquete|como.*ayudan|ayudan/i],answer:`Framerate Node ofrece 6 servicios para cumplir la Ley 21.719:

• Diagnóstico de cumplimiento: autoevaluación de 15 min.
• Registro de Actividades de Tratamiento (RAT).
• Políticas y avisos de privacidad.
• Gestión de derechos ARCOP y consentimientos.
• Adecuación de tu web (cookies, formularios, textos legales).
• Compliance mensual (monitoreo, actualizaciones, soporte).

Los paquetes van desde $79.900 CLP (Básico) hasta $299.900 CLP/mes (Integral).`},{patterns:[/precio|costo|cuánto.*cuesta|valor|presupuesto|desde.*\$/i],answer:`Precios referenciales:

• Diagnóstico inicial: sin costo.
• Políticas y avisos: desde $39.900 CLP.
• Paquete Básico (diagnóstico + políticas): $79.900 CLP.
• Paquete Estándar (Básico + RAT + ARCOP + cookies): $249.900 CLP.
• Paquete Integral: desde $299.900 CLP/mes.

El valor final depende del volumen de datos y la actividad de tu empresa.`},{patterns:[/cómo.*funciona|proceso|paso|etapa|metodolog|cómo.*partir/i],answer:`El proceso tiene 4 pasos:

1. Entrevista guiada: un agente conversacional te hace preguntas simples sobre dónde guardas y usas datos.
2. Normalización: estructuramos tus respuestas en formato legal.
3. Validación humana: tú revisas y apruebas todo.
4. Entrega viva: recibes un RAT dinámico, exportable y con historial.

Todo con agentes de IA y supervisión humana.`},{patterns:[/whatsapp|excel|sencillo|chiquit|micro.*empresa|solo.*uno/i],answer:"Si tu PYME usa solo Excel, WhatsApp o una web sencilla, la ley igual te aplica. El estándar de cumplimiento es diferenciado según el tamaño de la empresa (Art. 14 septies). Nuestro diagnóstico parte de detectar dónde están tus datos y qué riesgos tienes hoy, sin importar qué herramientas uses."},{patterns:[/abogad|legal|asesoría.*legal/i],answer:"No somos abogados. Somos servicios de automatización, legal-tech y desarrollo web. Los entregables son borradores para revisión profesional según la legislación chilena vigente. Para tu caso concreto, consulta con un profesional legal."},{patterns:[/rat|registro.*actividades.*tratamiento|registro.*tratamiento/i],answer:"El Registro de Actividades de Tratamiento (RAT) es la documentación que demuestra qué datos tienes, de dónde vienen, con qué base legal, finalidad y por cuánto tiempo. Es la evidencia principal que debes poder demostrar ante la APDP. El Art. 14 ter exige que el responsable mantenga esta información públicamente accesible. Nosotros lo creamos contigo a partir de una entrevista guiada."},{patterns:[/cookie|cookies|banner.*cookie|aviso.*cookie/i],answer:"La ley exige consentimiento explícito y por propósito para cada tipo de cookie. Se acabaron los checkbox escondidos. Con nuestro servicio de adecuación de web agregamos: banner de cookies funcional, formularios de aceptación por categoría (necesarias, analytics, marketing) y textos legales adaptados a tu sitio. Sin rediseñarlo entero."},{patterns:[/contact|escribir|llamar|horario|teléfono|correo/i],answer:"Puedes escribirnos desde el formulario de contacto de esta página (sección Contáctanos). Te respondemos en menos de 24 horas hábiles con el siguiente paso concreto, sin costo."}],fm=`No tengo una respuesta específica para eso, pero aquí te comparto lo que puedo:

• Sobre la ley: principios, derechos, multas, consentimiento, datos sensibles, evaluación de impacto, modelo de prevención.
• Sobre nuestros servicios: diagnóstico, RAT, políticas, gestión de derechos, adecuación de web.
• Precios: desde $39.900 CLP hasta $299.900 CLP/mes.
